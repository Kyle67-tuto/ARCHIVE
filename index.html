    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius:8px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  a{ color: var(--accent-3); }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size:14px;
    font-weight:600;
    color: var(--text);
    background: rgba(255,255,255,0.08);
    border:1px solid var(--border);
    transition: background .15s ease, transform .1s ease;
  }
  button:hover{ background: rgba(255,255,255,0.14); }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.primary{ background: linear-gradient(135deg, var(--accent), #c73f36); border-color: transparent; }
  button.primary:hover{ filter:brightness(1.08); }
  button.ghost{ background: transparent; }
  button.danger{ background: rgba(255,90,78,0.18); border-color: rgba(255,90,78,0.4); color:#ffb3ac; }

  input[type="text"], input[type="url"], textarea{
    font-family:inherit;
    background: rgba(0,0,0,0.35);
    border:1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size:14px;
    outline:none;
  }
  input::placeholder, textarea::placeholder{ color: #7d7c82; }
  input:focus, textarea:focus{ border-color: var(--accent-3); }

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 20px;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index: 50;
  }
  #brand{ display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px; font-size:18px; }
  #brand .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  #authArea{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    object-fit:cover; border:1px solid var(--border-strong);
    background:#333;
  }
  .userchip{ display:flex; align-items:center; gap:8px; }
  .username{ font-size:14px; font-weight:600; }
  .badge{
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:100px;
    background: rgba(247,200,115,0.2); color: var(--accent-2); border:1px solid rgba(247,200,115,0.35);
  }

  /* ---------- Layout ---------- */
  #app{ flex:1; display:flex; min-height:0; }
  #sidebar{
    width: 220px; flex-shrink:0;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    overflow-y:auto;
  }
  #sidebar h3{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
    margin: 10px 8px 6px;
  }
  .room-btn{
    width:100%; text-align:left; background:transparent; border:1px solid transparent;
    padding:9px 10px; border-radius:10px; font-weight:500; font-size:14px; color: var(--text-dim);
    display:flex; align-items:center; gap:8px;
  }
  .room-btn:hover{ background: rgba(255,255,255,0.06); color:var(--text); }
  .room-btn.active{ background: rgba(255,90,78,0.16); color: var(--text); border-color: rgba(255,90,78,0.3); }
  .room-btn .lock{ font-size:11px; opacity:.7; margin-left:auto; }

  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #roomHeader{
    padding: 14px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(0,0,0,0.15);
  }
  #roomHeader h2{ margin:0; font-size:16px; }
  #roomHeader .sub{ font-size:12px; color: var(--text-dim); margin-top:2px; }

  #messages{
    flex:1; overflow-y:auto; padding: 18px 20px; display:flex; flex-direction:column; gap:14px;
  }
  .msg{ display:flex; gap:10px; max-width: 720px; }
  .msg .avatar{ margin-top:2px; }
  .msg .body{
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 13px;
    position:relative;
  }
  .msg .meta{ display:flex; align-items:baseline; gap:8px; margin-bottom:3px; }
  .msg .meta .name{ font-weight:700; font-size:13.5px; }
  .msg .meta .time{ font-size:11px; color:var(--text-dim); }
  .msg .text{ font-size:14.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .msg img.attach{ max-width: 320px; max-height:320px; border-radius:10px; margin-top:6px; display:block; cursor:pointer; }
  .msg video.attach{ max-width: 360px; border-radius:10px; margin-top:6px; display:block; }
  .msg iframe.attach{ width:360px; height:203px; border-radius:10px; margin-top:6px; border:none; display:block; }
  .msg .del{
    position:absolute; top:6px; right:8px; font-size:11px; padding:3px 8px;
    background: rgba(255,90,78,0.25); border:1px solid rgba(255,90,78,0.4); border-radius: 8px;
    color:#ffcdc8; display:none;
  }
  .msg:hover .del{ display:inline-block; }

  #emptyState{ margin:auto; text-align:center; color:var(--text-dim); font-size:14px; }
  #emptyState .lockicon{ font-size:32px; display:block; margin-bottom:8px; }

  /* ---------- Composer ---------- */
  #composer{
    padding: 12px 20px 18px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.18);
  }
  #composerRow{ display:flex; gap:8px; align-items:flex-end; }
  #textInput{
    flex:1; resize:none; min-height:42px; max-height:120px;
  }
  #attachRow{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  #attachRow input[type="url"]{ flex:1; min-width:180px; }
  .pending-chip{
    display:flex; align-items:center; gap:6px; background: rgba(255,255,255,0.08);
    border:1px solid var(--border); border-radius:100px; padding:4px 10px; font-size:12px;
  }
  .pending-chip button{ padding:0 4px; background:none; border:none; font-size:13px; color:#ffb3ac; }
  #readonlyNote{
    text-align:center; color: var(--text-dim); font-size:13px; padding: 10px;
    border:1px dashed var(--border); border-radius:10px;
  }
  #signedOutNote{ text-align:center; padding:16px; color:var(--text-dim); font-size:14px; }

  /* ---------- Modals ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(0,0,0,0.55);
    display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--panel-solid);
    border:1px solid var(--border-strong);
    border-radius: 16px;
    width: 100%; max-width: 440px;
    padding: 22px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    max-height: 85vh; overflow-y:auto;
  }
  .modal.wide{ max-width: 640px; }
  .modal h3{ margin:0 0 14px; font-size:17px; }
  .modal label{ display:block; font-size:12px; color:var(--text-dim); margin: 12px 0 5px; }
  .modal input, .modal textarea{ width:100%; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .modal-close{ position:absolute; }
  .modal-top{ display:flex; justify-content:space-between; align-items:center; }
  .modal-top button{ padding:4px 10px; }

  .imgpreview{ width:72px; height:72px; border-radius:50%; object-fit:cover; border:1px solid var(--border-strong); }

  table.userlist{ width:100%; border-collapse:collapse; font-size:13px; }
  table.userlist th, table.userlist td{ text-align:left; padding:7px 6px; border-bottom:1px solid var(--border); }
  table.userlist td.actions{ display:flex; gap:6px; }
  .status-banned{ color: var(--danger); font-weight:600; }
  .status-ok{ color: var(--accent-3); font-weight:600; }

  #lightboxBackdrop{
    position:fixed; inset:0; background: rgba(0,0,0,0.85); display:none;
    align-items:center; justify-content:center; z-index:300; padding:30px;
  }
  #lightboxBackdrop.open{ display:flex; }
  #lightboxBackdrop img{ max-width:100%; max-height:100%; border-radius:10px; }

  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background: var(--panel-solid); border:1px solid var(--border-strong);
    padding:10px 18px; border-radius: 10px; font-size:13px; z-index:400;
    display:none;
  }

  @media (max-width: 760px){
    #sidebar{
      position: fixed; left:0; top:57px; bottom:0; z-index: 60;
      transform: translateX(-100%); transition: transform .2s ease;
      width: 210px;
    }
    #sidebar.open{ transform: translateX(0); }
    #menuBtn{ display:inline-flex; }
    .msg{ max-width: 92%; }
    .msg img.attach, .msg iframe.attach, .msg video.attach{ max-width: 100%; width:100%; }
  }
  #menuBtn{ display:none; }
</style>
</head>
<body>

<div id="topbar">
  <div id="brand">
    <button id="menuBtn" class="ghost" title="Rooms">☰</button>
    <span class="dot"></span> Nightline
  </div>
  <div id="authArea"><!-- filled by JS --></div>
</div>

<div id="app">
  <div id="sidebar">
    <h3>Rooms</h3>
    <div id="roomList"></div>
  </div>

  <div id="main">
    <div id="roomHeader">
      <div>
        <h2 id="roomTitle">general</h2>
        <div class="sub" id="roomSub">Open to everyone</div>
      </div>
      <div id="roomHeaderActions"></div>
    </div>

    <div id="messages"><div id="emptyState">Sign in to view the conversation.</div></div>

    <div id="composer" style="display:none;">
      <div id="attachRow" style="display:none;">
        <input type="url" id="videoUrlInput" placeholder="Paste a video URL (YouTube or direct .mp4 link)">
      </div>
      <div id="pendingImageArea" style="display:none; margin-bottom:8px;"></div>
      <div id="composerRow">
        <button id="attachImgBtn" class="ghost" title="Attach image">🖼️</button>
        <button id="attachVidBtn" class="ghost" title="Attach video link">🎬</button>
        <input type="file" id="imgFileInput" accept="image/*" style="display:none;">
        <textarea id="textInput" placeholder="Message #general"></textarea>
        <button id="sendBtn" class="primary">Send</button>
      </div>
    </div>
    <div id="readonlyNote" style="display:none;">This room is admin-only. You can view but not post here.</div>
    <div id="signedOutNote">Sign in with Google to join the conversation.</div>
  </div>
</div>

<!-- Profile modal -->
<div class="modal-backdrop" id="profileModalBackdrop">
  <div class="modal">
    <div class="modal-top"><h3>Edit profile</h3><button class="ghost" data-close="profileModalBackdrop">✕</button></div>
    <img id="profilePreview" class="imgpreview" src="" alt="">
    <label>Profile picture</label>
    <input type="file" id="profileFileInput" accept="image/*">
    <label>Display name</label>
    <input type="text" id="profileNameInput" maxlength="40">
    <div class="modal-actions">
      <button class="ghost" data-close="profileModalBackdrop">Cancel</button>
      <button class="primary" id="saveProfileBtn">Save changes</button>
    </div>
  </div>
</div>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminModalBackdrop">
  <div class="modal wide">
    <div class="modal-top"><h3>Admin panel</h3><button class="ghost" data-close="adminModalBackdrop">✕</button></div>

    <div class="modal-top" style="margin-top:0;">
      <label style="margin:0;">Rooms</label>
      <button id="addRoomBtn">+ New room</button>
    </div>
    <table class="userlist">
      <thead><tr><th>Room</th><th>Slug</th><th>Actions</th></tr></thead>
      <tbody id="adminRoomRows"></tbody>
    </table>

    <label>Users</label>
    <table class="userlist">
      <thead><tr><th>User</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="adminUserRows"></tbody>
    </table>
    <div class="modal-actions">
      <button class="ghost" data-close="adminModalBackdrop">Close</button>
    </div>
  </div>
</div>

<div id="lightboxBackdrop"><img id="lightboxImg" src="" alt=""></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, orderBy,
  limit, addDoc, deleteDoc, onSnapshot, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* ============ CONFIG ============ */
const firebaseConfig = {
  apiKey: "AIzaSyB9Z5Tjc0yWg69GlWdUBTZ9VgUcGrh5mMU",
  authDomain: "v-scans.firebaseapp.com",
  projectId: "v-scans",
  storageBucket: "v-scans.firebasestorage.app",
  messagingSenderId: "545198752043",
  appId: "1:545198752043:web:efdc1656b5fd4f354ec56e",
  measurementId: "G-NDQER8NPM9"
};

// The admin account — recognized by email, so no manual UID lookup is needed.
const ADMIN_EMAIL = "anwarbah96@gmail.com";

const IMGBB_API_KEY = "8d6b86a95a0dec73a237d731a3d7e095";

// 'general' is a fixed, permanent room — always open to everyone, cannot be renamed or deleted.
const GENERAL_ROOM = { slug: 'general', name: 'general', fixed: true };
// Everything else is admin-managed and lives in the 'roomsMeta' Firestore collection,
// so admins can rename, delete, or create rooms at runtime (see ROOM MANAGEMENT below).
let customRooms = [];        // [{ id, slug, name }] — id is the Firestore doc id
let unsubRoomsMeta = null;

function allRooms(){ return [GENERAL_ROOM, ...customRooms]; }
function roomBySlug(slug){ return allRooms().find(r => r.slug === slug) || GENERAL_ROOM; }

/* ============ INIT ============ */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;      // firebase auth user
let currentProfile = null;   // firestore user doc
let currentRoom = 'general';
let unsubMessages = null;
let unsubUsers = null;
let pendingImageUrl = null;
let usersCache = [];

const el = (id) => document.getElementById(id);
const isAdmin = () => !!currentUser && (currentUser.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
const canPostInRoom = (room) => {
  if (!currentUser) return false;
  if (currentProfile?.isBanned) return false;
  if (isAdmin()) return true;
  return room === 'general';
};

function toast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.style.display='none', 3200);
}

/* ============ SIDEBAR / ROOMS ============ */
function renderRoomList(){
  const list = el('roomList');
  list.innerHTML = '';
  allRooms().forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'room-btn' + (r.slug === currentRoom ? ' active' : '');
    btn.innerHTML = `<span>#${r.name}</span>` + (!r.fixed ? '<span class="lock">🔒</span>' : '');
    btn.onclick = () => switchRoom(r.slug);
    list.appendChild(btn);
  });
}

function switchRoom(slug){
  currentRoom = slug;
  renderRoomList();
  const r = roomBySlug(slug);
  el('roomTitle').textContent = '#' + r.name;
  el('roomSub').textContent = r.fixed
    ? 'Open to everyone — anyone signed in can post'
    : 'Admin-only room — announcements & curated media';
  el('textInput').placeholder = 'Message #' + r.name;
  document.getElementById('sidebar').classList.remove('open');
  loadMessages();
  updateComposerVisibility();
}

/* Live-subscribe to the admin-managed room list so every viewer's sidebar
   updates instantly when the admin renames, deletes, or creates a room. */
function watchRoomsMeta(){
  unsubRoomsMeta = onSnapshot(query(collection(db, 'roomsMeta'), orderBy('createdAt', 'asc')), (snap) => {
    customRooms = [];
    snap.forEach(d => customRooms.push({ id: d.id, ...d.data() }));
    renderRoomList();
    // If the room we're currently viewing was deleted, fall back to general.
    if (currentRoom !== 'general' && !customRooms.some(r => r.slug === currentRoom)){
      switchRoom('general');
    }
    if (isAdmin()) renderRoomRows();
  });
}

/* ============ AUTH ============ */
function renderAuthArea(){
  const wrap = el('authArea');
  wrap.innerHTML = '';
  if (!currentUser){
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = 'Sign in with Google';
    btn.onclick = () => signInWithPopup(auth, provider).catch(e => toast(e.message));
    wrap.appendChild(btn);
    return;
  }
  const chip = document.createElement('div');
  chip.className = 'userchip';
  const img = document.createElement('img');
  img.className = 'avatar';
  img.src = currentProfile?.photoURL || currentUser.photoURL || '';
  const name = document.createElement('span');
  name.className = 'username';
  name.textContent = currentProfile?.displayName || currentUser.displayName || 'User';
  chip.appendChild(img); chip.appendChild(name);
  if (isAdmin()){
    const b = document.createElement('span'); b.className='badge'; b.textContent='ADMIN';
    chip.appendChild(b);
  }
  wrap.appendChild(chip);

  if (isAdmin()){
    const adminBtn = document.createElement('button');
    adminBtn.textContent = 'Admin panel';
    adminBtn.onclick = openAdminPanel;
    wrap.appendChild(adminBtn);
  }

  const editBtn = document.createElement('button');
  editBtn.textContent = 'Edit profile';
  editBtn.onclick = openProfileModal;
  wrap.appendChild(editBtn);

  const outBtn = document.createElement('button');
  outBtn.className = 'ghost';
  outBtn.textContent = 'Sign out';
  outBtn.onclick = () => signOut(auth);
  wrap.appendChild(outBtn);
}

async function ensureUserDoc(user){
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()){
    const data = {
      uid: user.uid,
      displayName: user.displayName || 'User',
      photoURL: user.photoURL || '',
      email: user.email || '',
      isBanned: false,
      createdAt: serverTimestamp()
    };
    await setDoc(ref, data);
    return data;
  }
  return snap.data();
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user){
    currentProfile = await ensureUserDoc(user);
    // live-subscribe to own profile doc so ban status / edits reflect immediately
    onSnapshot(doc(db,'users', user.uid), (snap) => {
      if (snap.exists()){
        currentProfile = snap.data();
        renderAuthArea();
        updateComposerVisibility();
      }
    });
  } else {
    currentProfile = null;
  }
  renderAuthArea();
  updateComposerVisibility();
  loadMessages();
});

/* ============ COMPOSER VISIBILITY ============ */
function updateComposerVisibility(){
  const composer = el('composer');
  const readonlyNote = el('readonlyNote');
  const signedOutNote = el('signedOutNote');

  if (!currentUser){
    composer.style.display = 'none';
    readonlyNote.style.display = 'none';
    signedOutNote.style.display = 'block';
    return;
  }
  signedOutNote.style.display = 'none';

  if (currentProfile?.isBanned){
    composer.style.display = 'none';
    readonlyNote.style.display = 'block';
    readonlyNote.textContent = 'Your account has been banned from posting.';
    return;
  }

  if (canPostInRoom(currentRoom)){
    composer.style.display = 'block';
    readonlyNote.style.display = 'none';
  } else {
    composer.style.display = 'none';
    readonlyNote.style.display = 'block';
    readonlyNote.textContent = 'This room is admin-only. You can view but not post here.';
  }
}

/* ============ MESSAGES ============ */
function loadMessages(){
  if (unsubMessages) unsubMessages();
  const msgsEl = el('messages');
  msgsEl.innerHTML = '';

  const q = query(collection(db, 'rooms', currentRoom, 'messages'), orderBy('createdAt', 'asc'), limit(200));
  unsubMessages = onSnapshot(q, (snap) => {
    msgsEl.innerHTML = '';
    if (snap.empty){
      const empty = document.createElement('div');
      empty.id = 'emptyState';
      empty.textContent = currentRoom === 'general'
        ? 'No messages yet — say hello.'
        : 'No posts yet in this room.';
      msgsEl.appendChild(empty);
      return;
    }
    snap.forEach(docSnap => renderMessage(docSnap.id, docSnap.data()));
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }, (err) => {
    console.error(err);
    toast('Could not load messages: ' + err.message);
  });
}

function renderMessage(id, m){
  const msgsEl = el('messages');
  const row = document.createElement('div');
  row.className = 'msg';

  const avatar = document.createElement('img');
  avatar.className = 'avatar';
  avatar.src = m.photoURL || '';
  row.appendChild(avatar);

  const body = document.createElement('div');
  body.className = 'body';

  const meta = document.createElement('div');
  meta.className = 'meta';
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = m.displayName || 'User';
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString() : '';
  meta.appendChild(name); meta.appendChild(time);
  body.appendChild(meta);

  if (m.text){
    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = m.text;
    body.appendChild(text);
  }

  if (m.imageUrl){
    const img = document.createElement('img');
    img.className = 'attach';
    img.src = m.imageUrl;
    img.onclick = () => openLightbox(m.imageUrl);
    body.appendChild(img);
  }

  if (m.videoUrl){
    body.appendChild(buildVideoEl(m.videoUrl));
  }

  if (isAdmin()){
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Delete';
    del.onclick = () => deleteMessage(id);
    body.appendChild(del);
  }

  row.appendChild(body);
  msgsEl.appendChild(row);
}

function getYouTubeId(url){
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function buildVideoEl(url){
  const yt = getYouTubeId(url);
  if (yt){
    const iframe = document.createElement('iframe');
    iframe.className = 'attach';
    iframe.src = `https://www.youtube.com/embed/${yt}`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    return iframe;
  }
  const video = document.createElement('video');
  video.className = 'attach';
  video.src = url;
  video.controls = true;
  return video;
}

async function deleteMessage(id){
  if (!isAdmin()) return;
  if (!confirm('Delete this message?')) return;
  try{
    await deleteDoc(doc(db, 'rooms', currentRoom, 'messages', id));
  }catch(e){ toast('Delete failed: ' + e.message); }
}

/* ============ SEND ============ */
el('attachImgBtn').onclick = () => el('imgFileInput').click();
el('attachVidBtn').onclick = () => {
  const row = el('attachRow');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
};

el('imgFileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const area = el('pendingImageArea');
  area.style.display = 'block';
  area.innerHTML = '<div class="pending-chip">Uploading image…</div>';
  try{
    const url = await uploadToImgBB(file);
    pendingImageUrl = url;
    area.innerHTML = '';
    const chip = document.createElement('div');
    chip.className = 'pending-chip';
    chip.innerHTML = `<span>🖼️ image attached</span>`;
    const rm = document.createElement('button');
    rm.textContent = '✕';
    rm.onclick = () => { pendingImageUrl = null; area.style.display='none'; area.innerHTML=''; };
    chip.appendChild(rm);
    area.appendChild(chip);
  }catch(err){
    area.innerHTML = '';
    area.style.display = 'none';
    toast('Image upload failed: ' + err.message);
  }
  e.target.value = '';
};

async function uploadToImgBB(file){
  const formData = new FormData();
  formData.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: 'POST',
    body: formData
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error?.message || 'Upload failed');
  return json.data.url;
}

el('sendBtn').onclick = sendMessage;
el('textInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage(){
  if (!currentUser) return toast('Sign in first.');
  if (!canPostInRoom(currentRoom)) return toast('You cannot post in this room.');
  if (currentProfile?.isBanned) return toast('Your account is banned from posting.');

  const text = el('textInput').value.trim();
  const videoUrl = el('videoUrlInput').value.trim();

  if (!text && !pendingImageUrl && !videoUrl) return;

  const payload = {
    uid: currentUser.uid,
    displayName: currentProfile?.displayName || currentUser.displayName || 'User',
    photoURL: currentProfile?.photoURL || currentUser.photoURL || '',
    text: text || null,
    imageUrl: pendingImageUrl || null,
    videoUrl: videoUrl || null,
    createdAt: serverTimestamp()
  };

  try{
    await addDoc(collection(db, 'rooms', currentRoom, 'messages'), payload);
    el('textInput').value = '';
    el('videoUrlInput').value = '';
    el('attachRow').style.display = 'none';
    pendingImageUrl = null;
    el('pendingImageArea').style.display = 'none';
    el('pendingImageArea').innerHTML = '';
  }catch(e){
    toast('Send failed: ' + e.message);
  }
}

/* ============ PROFILE MODAL ============ */
function openProfileModal(){
  el('profilePreview').src = currentProfile?.photoURL || currentUser.photoURL || '';
  el('profileNameInput').value = currentProfile?.displayName || currentUser.displayName || '';
  openModal('profileModalBackdrop');
}

let pendingProfileFile = null;
el('profileFileInput').onchange = (e) => {
  pendingProfileFile = e.target.files[0] || null;
  if (pendingProfileFile){
    el('profilePreview').src = URL.createObjectURL(pendingProfileFile);
  }
};

el('saveProfileBtn').onclick = async () => {
  if (!currentUser) return;
  const btn = el('saveProfileBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    let photoURL = currentProfile?.photoURL || currentUser.photoURL || '';
    if (pendingProfileFile){
      photoURL = await uploadToImgBB(pendingProfileFile);
    }
    const displayName = el('profileNameInput').value.trim() || 'User';
    await updateDoc(doc(db, 'users', currentUser.uid), { displayName, photoURL });
    pendingProfileFile = null;
    closeModal('profileModalBackdrop');
    toast('Profile updated.');
  }catch(e){
    toast('Could not save profile: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'Save changes';
};

/* ============ ADMIN PANEL ============ */
function openAdminPanel(){
  if (!isAdmin()) return;
  loadUserList();
  renderRoomRows();
  openModal('adminModalBackdrop');
}

/* ---- Room management (create / rename / delete) ---- */
function renderRoomRows(){
  const tbody = el('adminRoomRows');
  if (!tbody) return;
  tbody.innerHTML = '';
  allRooms().forEach(r => {
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.textContent = r.name + (r.fixed ? ' (fixed)' : '');
    const slugTd = document.createElement('td');
    slugTd.textContent = r.slug;
    const actionsTd = document.createElement('td');
    actionsTd.className = 'actions';
    if (!r.fixed){
      const renameBtn = document.createElement('button');
      renameBtn.textContent = 'Rename';
      renameBtn.onclick = () => renameRoom(r);
      const delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = 'Delete';
      delBtn.onclick = () => deleteRoom(r);
      actionsTd.appendChild(renameBtn);
      actionsTd.appendChild(delBtn);
    }
    tr.appendChild(nameTd); tr.appendChild(slugTd); tr.appendChild(actionsTd);
    tbody.appendChild(tr);
  });
}

el('addRoomBtn').onclick = async () => {
  const name = prompt('Name for the new room (e.g. announcements):');
  if (!name || !name.trim()) return;
  // Generate a unique, URL/Firestore-safe slug so it never collides with an existing room path.
  const base = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'room';
  const slug = `${base}_${Date.now().toString(36)}`;
  try{
    await addDoc(collection(db, 'roomsMeta'), {
      slug,
      name: name.trim(),
      createdAt: serverTimestamp()
    });
    toast('Room created.');
  }catch(e){ toast('Could not create room: ' + e.message); }
};

async function renameRoom(room){
  const newName = prompt(`Rename #${room.name} to:`, room.name);
  if (!newName || !newName.trim() || newName.trim() === room.name) return;
  try{
    await updateDoc(doc(db, 'roomsMeta', room.id), { name: newName.trim() });
    toast('Room renamed.');
    if (currentRoom === room.slug){
      el('roomTitle').textContent = '#' + newName.trim();
      el('textInput').placeholder = 'Message #' + newName.trim();
    }
  }catch(e){ toast('Rename failed: ' + e.message); }
}

async function deleteRoom(room){
  if (!confirm(`Delete #${room.name}? Its message history will no longer be reachable from the sidebar.`)) return;
  try{
    await deleteDoc(doc(db, 'roomsMeta', room.id));
    toast('Room deleted.');
  }catch(e){ toast('Delete failed: ' + e.message); }
}

function loadUserList(){
  if (unsubUsers) unsubUsers();
  const tbody = el('adminUserRows');
  tbody.innerHTML = '<tr><td colspan="3">Loading…</td></tr>';
  unsubUsers = onSnapshot(collection(db, 'users'), (snap) => {
    usersCache = [];
    snap.forEach(d => usersCache.push({ id: d.id, ...d.data() }));
    renderUserRows();
  });
}

function renderUserRows(){
  const tbody = el('adminUserRows');
  tbody.innerHTML = '';
  usersCache.forEach(u => {
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    const uIsAdmin = (u.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
    nameTd.textContent = (u.displayName || 'User') + (uIsAdmin ? ' (admin)' : '');
    const statusTd = document.createElement('td');
    statusTd.innerHTML = u.isBanned ? '<span class="status-banned">Banned</span>' : '<span class="status-ok">Active</span>';
    const actionsTd = document.createElement('td');
    actionsTd.className = 'actions';
    if (!uIsAdmin){
      const btn = document.createElement('button');
      btn.className = u.isBanned ? '' : 'danger';
      btn.textContent = u.isBanned ? 'Unban' : 'Ban';
      btn.onclick = () => toggleBan(u.id, !u.isBanned);
      actionsTd.appendChild(btn);
    }
    tr.appendChild(nameTd); tr.appendChild(statusTd); tr.appendChild(actionsTd);
    tbody.appendChild(tr);
  });
}

async function toggleBan(uid, isBanned){
  try{
    await updateDoc(doc(db, 'users', uid), { isBanned });
    toast(isBanned ? 'User banned.' : 'User unbanned.');
  }catch(e){ toast('Failed: ' + e.message); }
}

/* ============ MODAL HELPERS ============ */
function openModal(id){ el(id).classList.add('open'); }
function closeModal(id){ el(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close')));
});
document.querySelectorAll('.modal-backdrop').forEach(bd => {
  bd.addEventListener('click', (e) => { if (e.target === bd) bd.classList.remove('open'); });
});

/* ============ LIGHTBOX ============ */
function openLightbox(src){
  el('lightboxImg').src = src;
  el('lightboxBackdrop').classList.add('open');
}
el('lightboxBackdrop').addEventListener('click', () => el('lightboxBackdrop').classList.remove('open'));

/* ============ MOBILE MENU ============ */
el('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

/* ============ BOOT ============ */
renderRoomList();
watchRoomsMeta();
switchRoom('general');
</script>
</body>
</html>
